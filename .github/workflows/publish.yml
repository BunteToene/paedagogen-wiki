name: Posts veröffentlichen

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten nach fälligen, freigegebenen Posts schauen
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Probelauf ohne echtes Posten (1 = ja)"
        default: "0"
      check:
        description: "Nur Verbindung prüfen, nichts posten (1 = ja)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Fällige Posts veröffentlichen
        env:
          DRY_RUN: ${{ inputs.dry_run || '0' }}
          CHECK: ${{ inputs.check || '0' }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python scripts/publish.py
      - name: Status speichern
        if: always()
        run: |
          git config user.name "paedagogen-wiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts
          git diff --cached --quiet || (git commit -m "Post-Status aktualisiert" && git push)
